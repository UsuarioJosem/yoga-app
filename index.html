<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d9e75" />
  <meta name="description" content="Sādhana — aprende y practica yoga desde principiante hasta avanzado." />
  <title>Sādhana · Yoga</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">ॐ</div>
      <div>
        <h1>Sādhana</h1>
        <p class="brand-sub">Tu práctica de yoga, paso a paso</p>
      </div>
    </div>
    <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Secciones">
    <button class="tab" data-tab="rutinas" role="tab" aria-selected="true">Rutinas</button>
    <button class="tab" data-tab="asanas" role="tab" aria-selected="false">Asanas</button>
    <button class="tab" data-tab="timer" role="tab" aria-selected="false">Temporizador</button>
    <button class="tab" data-tab="progreso" role="tab" aria-selected="false">Progreso</button>
  </nav>

  <main id="app">
    <section id="panel-rutinas" class="panel" role="tabpanel"></section>
    <section id="panel-asanas" class="panel" role="tabpanel" hidden></section>
    <section id="panel-timer" class="panel" role="tabpanel" hidden></section>
    <section id="panel-progreso" class="panel" role="tabpanel" hidden></section>
  </main>

  <footer class="app-footer">
    <p>Practica a tu ritmo. Escucha a tu cuerpo.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/poses.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
